<!-- Main content for the Contact Me Page-->

<main> 

    <section>
        <h2>Contact Me</h2>
        <p> 
            If you would like to get in touch with me,
            please fill out the form below
        </p>

        <form> 
            <!--Name Field-->
            <p>
                <label for = "name" >Name:</label><br>

                <input type="text"
                        id="name"
                        name="name"
                        required>
            </p>



            <!--Email Field-->
            <p>
                <label for = "email" >Email:</label><br>

                <input type="email"
                        id="email"
                        name="email"
                        required>
            
                        <!-- Cell number field -->
                <p>
                    <label for="phone">Cell Number:</label><br>

                    <input type="tel"
                           id="phone"
                           name="phone"
                           pattern="[0-9]{10}"
                           placeholder="9051234567"
                           required>
                </p>




                <!-- Comments field -->
                <p>
                    <label for="comments">Comments:</label><br>

                    <textarea id="comments"
                              name="comments"
                              rows="6"
                              required></textarea>
                </p>


                <!-- Submit button -->
                <p>
                    <input type="submit" value="Submit">
                </p>

            </form>

            </p>
        </form>
    </section>
</main>
